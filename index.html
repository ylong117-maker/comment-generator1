<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>评论生成器</title>


<style>

/* =========================
   基础
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #f6f6f6;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    color: #333;
}


/* =========================
   页面主体
========================= */

.container {

    width: 92%;

    max-width: 520px;

    margin: 0 auto;

    padding: 35px 0;

}


/* =========================
   顶部提示
========================= */

.title {

    text-align: center;

    font-size: 20px;

    font-weight: 600;

    line-height: 1.6;

    margin-bottom: 28px;

}


/* =========================
   分类按钮
========================= */

.buttons {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 14px;

}


.keyword {

    height: 58px;

    background: #fff;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 17px;

    color: #333;

    cursor: pointer;

    transition: all 0.2s ease;

}


/* 选中状态 */

.keyword.active {

    background: #f28c28;

    color: #fff;

    border-color: #f28c28;

}


/* =========================
   生成按钮
========================= */

.generate {

    width: 100%;

    height: 52px;

    margin-top: 24px;

    border: none;

    border-radius: 10px;

    background: #222;

    color: white;

    font-size: 17px;

    cursor: pointer;

}


/* =========================
   评论结果
========================= */

.result-box {

    margin-top: 22px;

    background: white;

    border-radius: 10px;

    padding: 15px;

}


textarea {

    width: 100%;

    min-height: 150px;

    border: none;

    outline: none;

    resize: vertical;

    font-size: 16px;

    line-height: 1.7;

    font-family: inherit;

}


/* =========================
   操作按钮
========================= */

.actions {

    display: flex;

    gap: 10px;

    margin-top: 12px;

}


.actions button {

    flex: 1;

    height: 46px;

    border-radius: 8px;

    border: 1px solid #ddd;

    background: white;

    font-size: 15px;

}


.copy {

    background: #222 !important;

    color: white;

    border-color: #222 !important;

}


/* =========================
   底部提示
========================= */

.tip {

    margin-top: 15px;

    text-align: center;

    color: #999;

    font-size: 12px;

    line-height: 1.6;

}

</style>

</head>


<body>


<div class="container">


    <!-- 顶部说明 -->

    <div class="title">

        请根据需求选择相应关键词，<br>

        生成评论

    </div>



    <!-- 分类按钮 -->

    <div class="buttons">


        <button
            class="keyword"
            onclick="selectCategory('果酒')">

            果酒

        </button>


        <button
            class="keyword"
            onclick="selectCategory('啤酒')">

            啤酒

        </button>


        <button
            class="keyword"
            onclick="selectCategory('白酒')">

            白酒

        </button>


        <button
            class="keyword"
            onclick="selectCategory('米酒')">

            米酒

        </button>


        <button
            class="keyword"
            onclick="selectCategory('梅酒')">

            梅酒

        </button>


        <button
            class="keyword"
            onclick="selectCategory('门店')">

            门店

        </button>


    </div>



    <!-- 生成按钮 -->

    <button
        class="generate"
        onclick="generateComment()">

        生成

    </button>



    <!-- 评论结果 -->

    <div class="result-box">


        <textarea
            id="result"
            placeholder="选择关键词后点击「生成」">
        </textarea>



        <div class="actions">


            <button
                id="regenerate"
                onclick="generateComment()">

                重新生成

            </button>


            <button
                id="copy"
                class="copy"
                onclick="copyComment()">

                一键复制

            </button>


        </div>


    </div>



    <!-- 底部提示 -->

    <div class="tip">

        请根据实际体验修改内容后再发布。

    </div>


</div>



<!-- 评论内容 -->

<script src="comments.js"></script>


<!-- 功能代码 -->

<script src="script.js"></script>



</body>

</html>
